spring:
  application:
    name: quanta
  # 本地配置（含真实凭据）放 application-local.yml，已被 .gitignore 忽略；
  # 文件不存在时 optional: 保证不报错，改用环境变量注入即可。
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: ${QUANTA_DB_URL:jdbc:mysql://127.0.0.1:3306/quanta?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${QUANTA_DB_USERNAME:}
    password: ${QUANTA_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis：snake_case 列名自动映射到 camelCase 字段（log_id -> logId）
mybatis:
  configuration:
    map-underscore-to-camel-case: true

# 健康检查：只暴露 health
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

# LangChain4j：M0 仅占位，真实模型配置在 M1（配置层）落库管理
langchain4j:
  open-ai:
    chat-model:
      api-key: ${QUANTA_LLM_API_KEY:demo}
      base-url: ${QUANTA_LLM_BASE_URL:https://api.deepseek.com/v1}
      model-name: ${QUANTA_LLM_MODEL:deepseek-chat}
      log-requests: false
      log-responses: false

# 日志：把 trace_id 打进每条日志的级别之后
logging:
  pattern:
    level: "%5p [%X{trace_id}]"

# 配置层（M1）
quanta:
  security:
    # 配置凭据的 AES 加密密钥（Base64 编码的 32 字节）。
    # 优先取环境变量 QUANTA_CONFIG_AES_KEY；本地开发可写在 application-local.yml。
    # 为空则启动直接失败（宁可起不来，也不允许明文存凭据）。
    aes-key: ${QUANTA_CONFIG_AES_KEY:}
  mt5:
    # MT5 桥接服务（mt5_service）地址，用于「测试连接」探活 /health
    base-url: ${QUANTA_MT5_BASE_URL:http://127.0.0.1:8765}
    health-timeout-ms: 5000
    # 一期固定 GOLD（FxPro 实测名；逻辑名 XAUUSD 由名称映射层转为 GOLD）
    symbol: ${QUANTA_MT5_SYMBOL:GOLD}
    # 是否用 sys_config 里激活的 MT5 凭据真实登录桥接服务（测试/离线场景可置 false）
    auto-login: ${QUANTA_MT5_AUTO_LOGIN:true}
  # 指标层（M4）：参数边界与默认周期一律集中配置（设计 §10 / §18）
  indicator:
    period-min: 2
    period-max: 200
    boll-k-min: 0.5
    boll-k-max: 5.0
    sma-period: 20
    ema-period: 20
    rsi-period: 14
    macd-fast: 12
    macd-slow: 26
    macd-signal: 9
    boll-period: 20
    boll-k: 2.0
    atr-period: 14
    volume-ma-period: 5
    # 通道/趋势类系数的合法边界（Keltner / Supertrend 的 ATR 倍数）
    multiplier-min: 0.5
    multiplier-max: 5.0
    # 多样化扩展指标的默认参数
    adx-period: 14
    aroon-period: 14
    stoch-period: 9
    stoch-k-period: 3
    stoch-d-period: 3
    cci-period: 20
    willr-period: 14
    roc-period: 10
    keltner-period: 20
    keltner-k: 2.0
    donchian-period: 20
    bbw-period: 20
    bbw-k: 2.0
    bbp-period: 20
    bbp-k: 2.0
    stddev-period: 20
    chop-period: 14
    supertrend-period: 10
    supertrend-k: 3.0
    adr-period: 14
  # 风控层（M5）：运行期参数 + 阈值兜底默认（正式阈值以 risk_config 表为准，人工可改）
  risk:
    # 合约规格（GOLD 实测 §7.1：1 手 = 100 盎司 → 1 USD 价差 = 100 USD/手）
    contract-size-per-lot: 100.0
    point: 0.01
    volume-step: 0.01
    volume-min: 0.01
    # R8 幂等窗口（秒）
    idempotency-window-seconds: 60
    # R12 开仓价与市价的最大偏离（%）
    max-price-deviation-pct: 0.5
    # R9 点差历史窗口与动态阈值
    spread-window-minutes: 60
    spread-min-samples: 12
    spread-median-multiplier: 3.0
    # R10 禁开窗口：休市星期 + 每日禁开时段（HH:mm，留空则不启用）
    closed-weekdays: SATURDAY,SUNDAY
    daily-blackout-start: ""
    daily-blackout-end: ""
    # 阈值兜底默认（risk_config 表为空时生效；表有值以表为准）
    default-fixed-volume: 0.01
    default-max-volume: 0.01
    default-max-positions: 3
    default-max-daily-loss: 50
    default-max-risk-pct: 2.00
    default-min-rr: 1.00
    default-min-sl-spread-mult: 5.00
    default-max-consecutive-loss: 3
    default-cooldown-minutes: 0
    default-spread-limit: 50
    default-symbol-whitelist: GOLD
  # 调度层（M7）：盯盘 / 触发 / 会话窗口（省 Token 的核心：Java 盯盘，命中才唤醒）
  schedule:
    # 总开关：关闭后 MarketWatcher 与 TriggerEngine 都不工作
    enabled: ${QUANTA_SCHEDULE_ENABLED:true}
    # 盯盘品种（券商真实名，一期 GOLD）
    symbol: ${QUANTA_MT5_SYMBOL:GOLD}
    # 会话窗口数上限，合法范围 1~20（设计 §6.3）
    max-session: 5
    market-watcher:
      enabled: true
      # 轮询间隔（毫秒）
      poll-interval-ms: 2000
      timeframe: M5
      kline-count: 200
      # 断线退避重连：起始 / 上限（毫秒）
      reconnect-base-ms: 2000
      reconnect-max-ms: 60000
      # 盯到的 K 线去重落库（market_kline）；失败不影响盯盘
      persist-klines: true
    trigger:
      # 扫描间隔（毫秒）
      scan-interval-ms: 1000
      # 每个触发源一个独立开关（T1/T2/T5/T6/T7 必做默认开；T3/T4 插件默认关；T8 二期）
      switches:
        T1: true
        T2: true
        T3: false
        T4: false
        T5: true
        T6: true
        T7: true
        T8: false
      # T2 时间驱动
      time:
        # 每 N 秒唤醒一次（设计「每 N 分钟」的细粒度等价；<=0 关闭）
        interval-seconds: 300
        # 每根 K 线收盘是否也唤醒
        bar-close: false
      # T5 持仓事件（浮动盈亏阈值，USD）
      position-event:
        profit-threshold: 5.0
        loss-threshold: 5.0
      # T3 形态插件（放量 + 吞没）
      pattern:
        volume-spike-multiplier: 1.8
        volume-ma-period: 20
      # T4 指标插件（RSI + 布林带）
      indicator:
        rsi-overbought: 70.0
        rsi-oversold: 30.0
  # 回测层（M8）：事件驱动 M1 重放 + 点差多档扫描（设计 §13）
  backtest:
    symbol: ${QUANTA_MT5_SYMBOL:GOLD}
    # 重放粒度：M1（需盘中判 SL/TP）
    timeframe: M1
    initial-equity: 500.0
    # 合约规格（GOLD 实测 §7.1：1 手 = 100 盎司）
    contract-size-per-lot: 100.0
    point: 0.01
    volume: 0.01
    # 点差档位（points）：0=无成本对照、16=当前实测、30=常规上限、50=极端
    spread-tiers: [0, 16, 30, 50]
    # 滑点档位（points）
    slippage-tiers: [0, 2, 5]
    default-slippage: 0
    # 单边点差系数：1.0 = 每边承担 1 个完整点差（设计「单边承担完整点差」，保守）
    spread-side-factor: 1.0
    # 隔夜费 swap（固定日均近似，报告中显式声明）
    swap-on: true
    swap-per-lot-per-day: -0.5
    swap-triple-weekday: WEDNESDAY
    settlement-hour: 0
    # 历史回填（拉取最近 N 天 M1 落库）
    backfill-days: 30
    # 回填按天分块请求历史（终端按需补下，小窗口更稳）
    fetch-chunk-days: 3
    disclaimer: "点差/滑点/swap 为固定近似值（MT5 仅提供 OHLC，无历史逐笔买卖价），回测结果不等同实盘实测，不得作为收益承诺。"
    # 默认策略参数（RULE 模式示例：EMA 金叉死叉 + ATR 止损）
    strategy:
      ema-fast: 9
      ema-slow: 21
      atr-period: 14
      atr-stop-mult: 1.5
      target-rr: 2.0