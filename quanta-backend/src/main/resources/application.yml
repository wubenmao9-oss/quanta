spring:
  application:
    name: quanta
  # 本地配置（含真实凭据）放 application-local.yml，已被 .gitignore 忽略；
  # 文件不存在时 optional: 保证不报错，改用环境变量注入即可。
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: ${QUANTA_DB_URL:jdbc:mysql://127.0.0.1:3306/quanta?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${QUANTA_DB_USERNAME:}
    password: ${QUANTA_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis：snake_case 列名自动映射到 camelCase 字段（log_id -> logId）
mybatis:
  configuration:
    map-underscore-to-camel-case: true

# 健康检查：只暴露 health
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

# LangChain4j：M0 仅占位，真实模型配置在 M1（配置层）落库管理
langchain4j:
  open-ai:
    chat-model:
      api-key: ${QUANTA_LLM_API_KEY:demo}
      base-url: ${QUANTA_LLM_BASE_URL:https://api.deepseek.com/v1}
      model-name: ${QUANTA_LLM_MODEL:deepseek-chat}
      log-requests: false
      log-responses: false

# 日志：把 trace_id 打进每条日志的级别之后
logging:
  pattern:
    level: "%5p [%X{trace_id}]"

# 配置层（M1）
quanta:
  security:
    # 配置凭据的 AES 加密密钥（Base64 编码的 32 字节）。
    # 优先取环境变量 QUANTA_CONFIG_AES_KEY；本地开发可写在 application-local.yml。
    # 为空则启动直接失败（宁可起不来，也不允许明文存凭据）。
    aes-key: ${QUANTA_CONFIG_AES_KEY:}
  mt5:
    # MT5 桥接服务（mt5_service）地址，用于「测试连接」探活 /health
    base-url: ${QUANTA_MT5_BASE_URL:http://127.0.0.1:8765}
    health-timeout-ms: 5000
    # 一期固定 GOLD（FxPro 实测名；逻辑名 XAUUSD 由名称映射层转为 GOLD）
    symbol: ${QUANTA_MT5_SYMBOL:GOLD}
    # 是否用 sys_config 里激活的 MT5 凭据真实登录桥接服务（测试/离线场景可置 false）
    auto-login: ${QUANTA_MT5_AUTO_LOGIN:true}
  # 指标层（M4）：参数边界与默认周期一律集中配置（设计 §10 / §18）
  indicator:
    period-min: 2
    period-max: 200
    boll-k-min: 0.5
    boll-k-max: 5.0
    sma-period: 20
    ema-period: 20
    rsi-period: 14
    macd-fast: 12
    macd-slow: 26
    macd-signal: 9
    boll-period: 20
    boll-k: 2.0
    atr-period: 14
    volume-ma-period: 5
    # 通道/趋势类系数的合法边界（Keltner / Supertrend 的 ATR 倍数）
    multiplier-min: 0.5
    multiplier-max: 5.0
    # 多样化扩展指标的默认参数
    adx-period: 14
    aroon-period: 14
    stoch-period: 9
    stoch-k-period: 3
    stoch-d-period: 3
    cci-period: 20
    willr-period: 14
    roc-period: 10
    keltner-period: 20
    keltner-k: 2.0
    donchian-period: 20
    bbw-period: 20
    bbw-k: 2.0
    bbp-period: 20
    bbp-k: 2.0
    stddev-period: 20
    chop-period: 14
    supertrend-period: 10
    supertrend-k: 3.0
    adr-period: 14