# 测试专用配置（仅 test classpath 生效，通过 @ActiveProfiles("test") 激活）
# 提供固定的测试 AES 密钥，使 Spring 上下文测试在无 application-local.yml 时也能构建 CryptoService。
# 注意：文件名必须带 -test，不能叫 application.yml，否则会覆盖主配置。
quanta:
  security:
    # Base64("0123456789abcdef0123456789abcdef") —— 仅测试用，禁止用于任何真实环境
    aes-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  mt5:
    # 测试 profile 的 AES 密钥与库内真实凭据的加密密钥不同（解密会 Tag mismatch），
    # 故测试中不发起"用库内凭据真实登录"，直接复用 mt5_service 自身已登录的会话（与 M3 IT 同思路）。
    auto-login: false
  schedule:
    # 测试环境关闭后台定时任务，避免盯盘/触发在其它用例中产生干扰与噪声日志；
    # M7 用例直接调用 MarketWatcher.poll() / TriggerEngine.scan() 验证行为。
    enabled: false
